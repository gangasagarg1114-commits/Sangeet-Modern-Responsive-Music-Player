<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sangeet - Premium Cinematic Player</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  </head>

  <body>
    <!-- Main music player -->
    <div class="player-shell">
      <div class="player-container" id="playerContainer">
        <video id="bgVideo" autoplay loop muted playsinline></video>
        <div class="bg-overlay"></div>

        <!-- Logo and music category buttons -->
        <div class="top-bar">
          <div class="brand-badge" aria-label="Sangeet logo">
            <div class="brand-mark">
              <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
                <defs>
                  <linearGradient id="brandGradient" x1="0%" x2="100%" y1="0%" y2="100%">
                    <stop offset="0%" stop-color="#a9ffd0" />
                    <stop offset="50%" stop-color="#63f3a7" />
                    <stop offset="100%" stop-color="#1ed760" />
                  </linearGradient>
                </defs>
                <rect x="5" y="5" width="54" height="54" rx="18" fill="rgba(5,10,15,0.85)" stroke="rgba(255,255,255,0.08)"/>
                <path d="M22 18c-6 1-10 7-10 13 0 7 5 12 12 12 3 0 6-1 9-3v16h8V20.5c0-2.5-1.8-4.5-4.3-4.5H22z" fill="url(#brandGradient)" opacity="0.24"/>
                <path d="M42 17c-4-5-10-7-16-5-7 3-11 10-9 17 2 7 10 9 16 8 5-2 8-6 8-11 0-5-3-7-9-7-4 0-7 2-7 5 0 3 2 4 6 5" fill="none" stroke="url(#brandGradient)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M26 22v20.5c0 3.8-2.5 7.2-6.2 8.2-5.3 1.5-10.5-2.6-10.5-8.2 0-6.4 5.6-9.8 10.3-8.5" fill="none" stroke="url(#brandGradient)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="44.5" cy="20.5" r="4.5" fill="#f5d37a"/>
                <path d="M47 18v18" stroke="#f5d37a" stroke-width="2.3" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="brand-wordmark">Sangeet</div>
          </div>

        </div>

        <!-- Album cover, song details and controls -->
        <div class="player-center-wrapper">
          <div class="inner-capsule">
            <div class="cover-circle">
              <img id="cover" src="images/default-cover.jpg" alt="Album Art" />
            </div>

            <div class="track-core">
              <div class="song-info">
                <h2 id="title">Song Name</h2>
                <p id="artist">Singer Name</p>
              </div>

              <div class="progress-bar">
                <span id="current">0:00</span>
                <input type="range" id="progress" value="0" min="0" max="100" />
                <span id="duration">0:00</span>
              </div>

              <div class="bottom-row">
                <div class="controls">
                  <button id="shuffle" class="control-btn" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
                  <button id="prev" class="control-btn" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
                  <button id="play" class="play-btn" aria-label="Play or pause"><i id="playIcon" class="fa-solid fa-play"></i></button>
                  <button id="next" class="control-btn" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
                  <button id="repeat" class="control-btn" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
                </div>

                <div class="utility-controls">
                  <div class="volume-control">
                    <i class="fa-solid fa-volume-high"></i>
                    <input type="range" id="volume" value="0.8" min="0" max="1" step="0.01" />
                  </div>

                  <div class="playlist-control">
                    <button class="playlist-toggle" id="playlistBtn" type="button" aria-haspopup="dialog" aria-controls="playlistPanel" aria-expanded="false">
                      <i class="fa-solid fa-list-music" aria-hidden="true"></i>
                      <span>Playlist</span>
                    </button>
                    <div class="playlist-panel" id="playlistPanel" hidden>
                      <div class="playlist-heading">
                        <div>
                          <p class="eyebrow">Now playing vibe</p>
                          <h3 id="playlistTitle">90s</h3>
                        </div>
                        <span id="playlistCount">0 songs</span>
                      </div>
                      <div class="playlist-list" id="playlistList"></div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="vibe-options">
          <button class="vibe-pill active" data-vibe="90s">90s</button>
          <button class="vibe-pill more-vibes-btn" id="moreVibesBtn" type="button" aria-haspopup="dialog" aria-controls="vibesModal">
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            <span>More Vibes</span>
          </button>
        </div>

        <audio id="audio"></audio>
      </div>
    </div>

    <div class="modal-backdrop" id="vibesModal" hidden>
      <section class="vibes-modal" role="dialog" aria-modal="true" aria-labelledby="vibesModalTitle">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">Explore your sound</p>
            <h2 id="vibesModalTitle">All Vibes</h2>
          </div>
          <button class="modal-close" id="closeVibesBtn" type="button" aria-label="Close vibes menu">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="genre-grid" id="genreGrid">
          <button class="genre-card" type="button" data-vibe="newHindi">
            <i class="fa-solid fa-music" aria-hidden="true"></i>
            <span>New Hindi</span>
            <small>Fresh melodies</small>
          </button>
          <button class="genre-card" type="button" data-vibe="bhojpuri">
            <i class="fa-solid fa-drum" aria-hidden="true"></i>
            <span>Bhojpuri</span>
            <small>Desi energy</small>
          </button>
          <button class="genre-card" type="button" data-vibe="punjabi">
            <i class="fa-solid fa-bolt" aria-hidden="true"></i>
            <span>Punjabi</span>
            <small>High voltage</small>
          </button>
          <button class="genre-card" type="button" data-vibe="haryanvi">
            <i class="fa-solid fa-fire" aria-hidden="true"></i>
            <span>Haryanvi</span>
            <small>Raw beats</small>
          </button>
          <button class="genre-card" type="button" data-vibe="english">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span>English</span>
            <small>Global pop</small>
          </button>
        </div>
      </section>
    </div>

    <!-- Footer and social links -->
    <footer class="footer">
      <p>Crafted with ❤️ by <span>Ganga Sagar Tiwari</span></p>
      <div class="social-links">
        <a href="https://github.com/gangasagarg1114-commits" target="_blank" rel="noreferrer"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/gangasagar-softwareengineer/" target="_blank" rel="noreferrer"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.instagram.com/_ami_t_tiwari_/" target="_blank" rel="noreferrer"><i class="fab fa-instagram"></i></a>
        <a href="https://x.com/buildwithganga" target="_blank" rel="noreferrer"><i class="fab fa-x-twitter"></i></a>
      </div>
    </footer>

    <script src="songs-90s.js"></script>
    <script src="songs-bhojpuri.js"></script>
    <script src="songs-newHindi.js"></script>
    <script src="songs-punjabi.js"></script>
    <script src="songs-haryanvi.js"></script>
    <script src="songs-english.js"></script>
    <script src="new.js"></script>
  </body>
</html>
